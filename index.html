<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verdant Vale</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0e1520;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
  }

  #title {
    color: #7a9a8a;
    font-size: 13px;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  canvas {
    display: block;
    outline: none;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border: 3px solid #253040;
    box-shadow: 0 0 48px rgba(30, 70, 100, 0.45);
  }

  #controls {
    color: #3a5060;
    font-size: 10px;
    letter-spacing: 2px;
    margin-top: 10px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div id="title">Verdant Vale</div>
<canvas id="game" width="512" height="480" tabindex="0"></canvas>
<div id="controls">Arrow Keys / WASD &mdash; Move &nbsp;|&nbsp; Space / Enter &mdash; Talk &nbsp;|&nbsp; M / Esc &mdash; Menu</div>

<script src="tiles.js"></script>
<script src="content/maps/calwick-maps.js"></script>

<script src="items.js"></script>
<script src="shops.js"></script>
