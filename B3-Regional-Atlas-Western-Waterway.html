  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {

      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

        storedState.imageIds.some(

        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

&lt;div id=&quot;b3w-lowlands-sector&quot;&gt;
  &lt;style&gt;
    #b3w-lowlands-sector { color: var(--foreground); }
    #b3w-lowlands-sector .map-holder { width: 100%; }
    #b3w-lowlands-sector .sector-map { display: block; width: 100%; overflow: visible; }
    #b3w-lowlands-sector .sector-map text { font-family: inherit; fill: var(--foreground); font-size: 12px; font-weight: 400; }
    #b3w-lowlands-sector .sector-map .region-label { font-weight: 500; }
    #b3w-lowlands-sector .sector-map .quiet-label { fill: var(--muted-foreground); }
    #b3w-lowlands-sector .detail { margin-top: 12px; }
    #b3w-lowlands-sector .detail p { margin: 8px 0 0; }
    #b3w-lowlands-sector .detail select { width: 100%; }
    #b3w-lowlands-sector .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 8px; }
    #b3w-lowlands-sector .legend span { display: inline-flex; align-items: center; gap: 6px; }
    #b3w-lowlands-sector .swatch { width: 14px; height: 10px; display: inline-block; }
    #b3w-lowlands-sector .landscape-key { font-weight: 500; }
  &lt;/style&gt;
  &lt;h3&gt;B3 · Fens and Valmere Lowlands&lt;/h3&gt;
  &lt;div class=&quot;text-small&quot;&gt;Regional waters draft · 500 × 500 chunks · Valmere approximately 115,000 km²&lt;/div&gt;
  &lt;div class=&quot;map-holder&quot;&gt;
    &lt;svg class=&quot;sector-map&quot; role=&quot;img&quot; aria-label=&quot;B3 regional waters map. Valmere covers the drowned central lowlands. Mornay and Drynport face one another across its western arm. Sedgewater occupies a small basin in the Great Fen; Harthmere lies in the east; Thornmere and the North Basin lie by the starting towns. Four small Moraine Lakes drain south, and seasonal backwaters fringe the Brinne. Ruins, roads, towns and the 500 by 500 chunk planning grid are shown.&quot;&gt;&lt;/svg&gt;
  &lt;/div&gt;
  &lt;div class=&quot;legend text-small&quot; aria-label=&quot;Map legend&quot;&gt;
    &lt;span&gt;&lt;i class=&quot;swatch&quot; style=&quot;background:color-mix(in srgb,var(--blue) 45%,transparent)&quot;&gt;&lt;/i&gt;Water&lt;/span&gt;
    &lt;span&gt;&lt;i class=&quot;swatch&quot; style=&quot;background:color-mix(in srgb,var(--green) 22%,transparent)&quot;&gt;&lt;/i&gt;Fen / wetland&lt;/span&gt;
    &lt;span&gt;&lt;i class=&quot;swatch&quot; style=&quot;background:color-mix(in srgb,var(--green) 45%,transparent)&quot;&gt;&lt;/i&gt;Woodland&lt;/span&gt;
    &lt;span&gt;&lt;i class=&quot;swatch&quot; style=&quot;background:color-mix(in srgb,var(--yellow) 28%,transparent)&quot;&gt;&lt;/i&gt;Fields / terraces&lt;/span&gt;
    &lt;span&gt;&lt;i class=&quot;swatch&quot; style=&quot;background:color-mix(in srgb,var(--orange) 28%,transparent)&quot;&gt;&lt;/i&gt;Ridges / uplands&lt;/span&gt;
    &lt;span&gt;● Town &amp;nbsp; ◆ Surviving ruin &amp;nbsp; ◇ Submerged ruin &amp;nbsp; → Downstream&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;detail&quot;&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;b3w-place-select&quot;&gt;Explore a landscape or town&lt;/label&gt;
    &lt;select class=&quot;form-select&quot; id=&quot;b3w-place-select&quot;&gt;&lt;/select&gt;
    &lt;p id=&quot;b3w-place-detail&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;b3w-lowlands-sector&#x27;);
    const svg = root.querySelector(&#x27;.sector-map&#x27;);
    const holder = root.querySelector(&#x27;.map-holder&#x27;);
    const select = root.querySelector(&#x27;select&#x27;);
    const detail = root.querySelector(&#x27;#b3w-place-detail&#x27;);
    const NS = &#x27;http://www.w3.org/2000/svg&#x27;;
    const records = [
      { id:&#x27;whole&#x27;, group:&#x27;Landscapes&#x27;, name:&#x27;Whole B3 sector&#x27;, text:&#x27;Valmere dominates the drowned central lowlands. Smaller waters include Sedgewater in the Great Fen, eastern Harthmere, local Thornmere and the North Basin, four linked southern Moraine Lakes and Brinne backwaters. Columns increase eastward and rows southward. New names, drainage links and absolute planning coordinates are proposals, separate from existing game coordinates.&#x27; },
      { id:&#x27;fen&#x27;, group:&#x27;Landscapes&#x27;, name:&#x27;Great Fen&#x27;, at:[119,176], text:&#x27;Western lowlands, broadly columns 50–190 and rows 35–335. A vast peat-and-sedge country with willow carr, wet meadows, gravel islands and converging slow channels. Roads skirt its margins. Fenreach is one of very few market settlements in the interior; most communities are tiny and reached by boat.&#x27; },
      { id:&#x27;arc&#x27;, group:&#x27;Landscapes&#x27;, name:&#x27;Arc foothills&#x27;, at:[36,213], text:&#x27;The western edge of B3 is the descending toe of A3’s ancient volcanic province. Weathered ridges, wooded ravines, quarry stone and mineral-fed streams replace the higher, drier Arc country farther west. Keld stands at a practical transfer point between upland trails and lowland water transport.&#x27; },
      { id:&#x27;terraces&#x27;, group:&#x27;Landscapes&#x27;, name:&#x27;Northern terraces&#x27;, at:[273,62], text:&#x27;Broad river terraces, oak woods, pasture and more continuous farming towards B2. The best fields occupy drained loam and old shoreline benches; wet hollows remain. Harrowford controls a dependable crossing on the north-flowing Brinne.&#x27; },
      { id:&#x27;drowned&#x27;, group:&#x27;Landscapes&#x27;, name:&#x27;Drowned Lowlands&#x27;, at:[277,258], text:&#x27;The old central plain is underwater. Former river valleys extend into long bays, the highest gravel and bedrock ridges form islands, and fields, roads and lower town districts lie beneath the shallows. The timing and cause of the inundation remain open. The present drought can expose fragments on the margins without reversing the older flooding.&#x27; },
      { id:&#x27;eastern&#x27;, group:&#x27;Landscapes&#x27;, name:&#x27;Eastern Wolds and wooded rises&#x27;, at:[405,265], text:&#x27;A broad eastern belt of mixed woodland, low scarps and branching valleys, rising towards C3. Small watersheds drain either west to Valmere and the Brinne or north into the Lume system; low divides separate them. Dunholt serves Harthmere’s local lake district; Veycross connects a river crossing with the eastern upland road.&#x27; },
      { id:&#x27;south&#x27;, group:&#x27;Landscapes&#x27;, name:&#x27;Southern Moraine country&#x27;, at:[267,444], text:&#x27;Connected gravel-and-till ridges, kettle hollows, woodland, pasture and modest cereal fields. The four Moraine Lakes occupy a descending southern valley, connected by short streams and draining towards B4. Scattered kettle ponds occupy separate hollows. Rookstead sits in a useful gap; the climate grows colder southward.&#x27; },
      { id:&#x27;wetwoods&#x27;, group:&#x27;Landscapes&#x27;, name:&#x27;Southwestern wetwoods&#x27;, at:[60,400], text:&#x27;A sparsely settled mosaic of wet birch and alder woods, peat hollows and old river terraces. A west-flowing river crosses the wetwoods and continues beyond this map through a low southern gap in A3’s uplands to the western coast. Drenwick’s canal joins that river. Low divides separate this western drainage from the Valmere and southern maritime catchments.&#x27; },
      { id:&#x27;valmere&#x27;, group:&#x27;Landscapes&#x27;, name:&#x27;Valmere&#x27;, at:[280,221], text:&#x27;A freshwater inland sea of approximately 115,000 km², around 8% of B3. It extends roughly 600 km along its southwest–northeast axis, widening into a broad central and northern basin. Mornay and Drynport remain about 60 km apart across the narrower western arm. The flooded former plain supplies shallow shelves, submerged valleys and surviving ridge-islands.&#x27; },
      { id:&#x27;brinne&#x27;, group:&#x27;Landscapes&#x27;, name:&#x27;Brinne corridor — proposed&#x27;, at:[310,111], text:&#x27;The proposed Brinne leaves Valmere’s northern end, descends through Lockmere and the northern terrace country, then continues into B2 to meet the Lume southwest of Lumina. Harthmere’s outlet joins at Lockmere. Oxbows and seasonal backwaters occupy the broad floodplain downstream. The cause and age of Valmere’s higher water remain undecided.&#x27; },
      { id:&#x27;lume&#x27;, group:&#x27;Landscapes&#x27;, name:&#x27;Lume corner&#x27;, at:[466,39], text:&#x27;The Lume rises in northern C3, descends northwest across B3’s northeastern corner and continues into B2, where it bends northeast through the heartland. Its route is separate from the Brinne within this sector; their confluence and Lumina are farther north in B2.&#x27; },
      { id:&#x27;sedgewater&#x27;, group:&#x27;Smaller waters&#x27;, name:&#x27;Sedgewater — proposed name&#x27;, at:[152,167], text:&#x27;Approximately (152,167). A shallow fen lake of roughly 600 km², with dark water, soft margins, reed beds and floating vegetation. The northern fen channel enters here and continues south to Fenreach before reaching Valmere’s western arm. The surrounding Great Fen remains mostly vegetated land and wetland.&#x27; },
      { id:&#x27;harthmere&#x27;, group:&#x27;Smaller waters&#x27;, name:&#x27;Harthmere — proposed name&#x27;, at:[400,179], text:&#x27;Approximately (400,179). An eastern forest lake of about 5,600 km² in its own basin. Dunholt occupies the western outlet. Tributaries descend from the C3-facing wooded rises, while the outlet flows northwest to the Brinne at Lockmere. A wooded divide separates it from Valmere.&#x27; },
      { id:&#x27;thornmere&#x27;, group:&#x27;Smaller waters&#x27;, name:&#x27;Thornmere&#x27;, at:[141,373], text:&#x27;Approximately (141,373), moved north so its northwestern shore lies close to Drenwick. A short canal reaches the lake from town, then continues west to a river through the wetwoods and onward to A3’s western coast. The lake remains a shallow, sheltered sea-and-fen system of roughly 700 km². Macro-atlas dimensions remain approximate.&#x27; },
      { id:&#x27;drenwick-canal&#x27;, group:&#x27;Smaller waters&#x27;, name:&#x27;Drenwick Canal&#x27;, at:[129,366], text:&#x27;Thornmere’s northwestern shore connects to Drenwick, then the canal runs west to join the western river near (120,366). This gives the lake district a navigable route through the wetwoods and onward to A3’s western coast. Locks handle differences in level between catchments; the canal does not imply a second natural outlet from Valmere.&#x27; },
      { id:&#x27;west-river&#x27;, group:&#x27;Smaller waters&#x27;, name:&#x27;Western river — name undecided&#x27;, at:[70,383], text:&#x27;A river flowing west through the wetwoods. Drenwick’s canal enters near (120,366); the river continues west through B3 and exits at approximately (0,393). Beyond this map it reaches the western coast in A3, using a low valley south of the Arc’s principal uplands. Its off-map course and eventual name remain open.&#x27; },
      { id:&#x27;north-basin&#x27;, group:&#x27;Smaller waters&#x27;, name:&#x27;North Basin reservoir&#x27;, at:[134,360], text:&#x27;Approximately (134,360), shown as a small blue mark north of Drenwick. This represents the existing reservoir and sluice district at continental overview scale. Its outline is schematic; existing authored maps, quest mechanics and local connections remain authoritative.&#x27; },
      { id:&#x27;moraine-lakes&#x27;, group:&#x27;Smaller waters&#x27;, name:&#x27;Moraine Lakes — proposed group&#x27;, at:[339,474], text:&#x27;Four small lakes near (322,442), (321,456), (339,474) and (354,489), roughly 100–250 km² each. They occupy successively lower basins in a valley through the southern moraine country. Short connecting streams descend south into B4. Separate kettle ponds lie in neighbouring hollows.&#x27; },
      { id:&#x27;backwaters&#x27;, group:&#x27;Smaller waters&#x27;, name:&#x27;Brinne backwaters&#x27;, at:[288,101], text:&#x27;Several oxbows, shallow flood lakes and seasonally inundated meadows in the northern Brinne corridor. Dashed water outlines indicate seasonal margins. These are selected examples, enlarged slightly for legibility; the river valley contains many smaller pools and abandoned bends.&#x27; },
      { id:&#x27;calwick&#x27;, group:&#x27;Established places&#x27;, name:&#x27;Calwick&#x27;, at:[129,368], text:&#x27;Approximately (129,368). The small IJC posting and reed-and-fen town remain in southwestern B3. Drenwick is immediately east. These are macro-atlas anchors only; existing local grids and travel routes are unchanged.&#x27; },
      { id:&#x27;drenwick&#x27;, group:&#x27;Established places&#x27;, name:&#x27;Drenwick&#x27;, at:[135,368], text:&#x27;Approximately (135,368). The canal town stands close to Thornmere’s northwestern shore, east of Calwick. Its canal runs west to a river through the wetwoods, connecting onward to A3’s western coast. The ferry remains northeast around (140,365), with the existing two-day road journey to Mornay.&#x27; },
      { id:&#x27;mornay&#x27;, group:&#x27;Established places&#x27;, name:&#x27;Mornay&#x27;, at:[157,352], text:&#x27;Approximately (157,352). A town of about 8,000 at the tip of a north-projecting peninsula on Valmere’s southwestern shore, near the fen-channel mouth. It is a modest regional office and transfer harbour, with no railway. Drynport is almost directly north, across about 60 km of water.&#x27; },
      { id:&#x27;drynport&#x27;, group:&#x27;Established places&#x27;, name:&#x27;Drynport&#x27;, at:[154,327], text:&#x27;Approximately (154,327). The major Valmere city occupies a sheltered bay on the northwestern shore, where western rivers and canal traffic arrive. Stable older ground supports the first districts; later neighbourhoods spread around islands, channels and embanked banks. Its old “northeastern B3” description is superseded by the agreed northwestern-lakeshore position.&#x27; },
      { id:&#x27;keld&#x27;, group:&#x27;Proposed towns&#x27;, name:&#x27;Keld&#x27;, at:[66,213], text:&#x27;Approximately (66,213). An upland-to-lowland transfer town on firm ground near the navigable head of an Arc-fed river. Quarry stone, ore consignments and timber come down trails; shallow boats carry them onwards. Its site explains both a market and a small Imperial customs office.&#x27; },
      { id:&#x27;fenreach&#x27;, group:&#x27;Proposed towns&#x27;, name:&#x27;Fenreach&#x27;, at:[159,221], text:&#x27;Approximately (159,221). A small market town on a gravel rise where two fen channels meet. Reed, peat, fish and boat repair support it. There is no through-road across the Great Fen here; water routes and local knowledge matter more than Imperial road distances.&#x27; },
      { id:&#x27;harrowford&#x27;, group:&#x27;Proposed towns&#x27;, name:&#x27;Harrowford&#x27;, at:[262,78], text:&#x27;Approximately (262,78). A bridge and market town on a narrow, dependable Brinne crossing. It collects livestock and produce from northern terraces, maintains flood marks and bridge tolls, and links local traffic to B2’s richer agricultural heartland.&#x27; },
      { id:&#x27;dunholt&#x27;, group:&#x27;Proposed towns&#x27;, name:&#x27;Dunholt&#x27;, at:[377,185], text:&#x27;Approximately (377,185). A timber-and-fishing town at Harthmere’s outlet, on a low rock spur above its shore. The western outlet valley and a ridge road connect it to the Brinne near Lockmere. Its local lake remains separate from the enlarged Valmere behind an intervening wooded divide.&#x27; },
      { id:&#x27;lockmere&#x27;, group:&#x27;Proposed towns&#x27;, name:&#x27;Lockmere&#x27;, at:[309,137], text:&#x27;Relocated to approximately (309,137), just downstream of Valmere’s new northern outlet. An old weir, a short bypass canal, repairs and transshipment support the settlement. Its infrastructure serves the existing water level; it does not establish what originally drowned the central plain.&#x27; },
      { id:&#x27;veycross&#x27;, group:&#x27;Proposed towns&#x27;, name:&#x27;Veycross&#x27;, at:[358,321], text:&#x27;Approximately (358,321). A bridge town where the eastern road crosses the principal west-flowing tributary before it reaches Valmere. Traffic from C3’s lower uplands meets lake-bound produce here. Its compact core sits on a terrace above the river, with mills upstream.&#x27; },
      { id:&#x27;rookstead&#x27;, group:&#x27;Proposed towns&#x27;, name:&#x27;Rookstead&#x27;, at:[239,427], text:&#x27;Approximately (239,427). A stock market and forestry town in a low moraine gap. It serves a broad, thinly settled southern hinterland and the road continuing towards B4’s harbours. Oats, rye, pasture and winter supplies matter more here than the rich farming of B2.&#x27; },
      { id:&#x27;ruin-west&#x27;, group:&#x27;Selected ruins&#x27;, name:&#x27;Nine Arches — working name&#x27;, at:[110,295], text:&#x27;Approximately (110,295). Remains of a major pre-Imperial crossing on a raised embankment through the western fen. The current channel is smaller and offset from the original bridge, leaving several arches over peat and pasture.&#x27; },
      { id:&#x27;ruin-central&#x27;, group:&#x27;Selected ruins&#x27;, name:&#x27;Old Court Island — working name&#x27;, at:[299,244], text:&#x27;Approximately (299,244). The highest civic terrace survives as an island. Its ruined upper court remains above water; streets, fields and the former lower settlement extend into the lake. The ancient kingdom’s identity and the inundation’s date remain undecided.&#x27; },
      { id:&#x27;ruin-drowned&#x27;, group:&#x27;Selected ruins&#x27;, name:&#x27;Sunken Causeway — working name&#x27;, at:[249,269], submerged:true, text:&#x27;Approximately (249,269). A former road crosses the drowned valley between surviving ridge-islands. Sections lie just below the shallows; broken towers and boundary stones may reappear during exceptional low water. Its dotted route is historical, not a present-day land crossing.&#x27; }
